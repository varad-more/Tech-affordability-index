# Render blueprint. `render.yaml` in the repo root makes the service
# reproducible from source instead of from settings someone clicked once.
#
# Two workers, four threads each. The app holds ~2 MB of datasets per process
# and every request is CPU-light but never I/O-blocked — nothing here talks to a
# database or a third party — so threads are cheap and workers are what cost
# memory. Raise workers before threads if CPU is the bottleneck.
services:
  - type: web
    name: affordability-index
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn wsgi:app --bind 0.0.0.0:$PORT --workers 2 --threads 4 --timeout 30
    healthCheckPath: /api/meta
    envVars:
      - key: PYTHON_VERSION
        value: "3.12"
      # The canonical origin the pages advertise. Set this per environment: a
      # staging deploy that inherits the production value will publish canonical
      # tags pointing at a host it does not control.
      - key: SITE_ORIGIN
        value: https://affordability-index.varadmore.me
