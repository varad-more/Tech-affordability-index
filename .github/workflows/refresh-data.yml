name: Refresh rent data

# Zillow publishes ZORI monthly, but the release date drifts — it landed on the
# 16th in July 2026. A fixed monthly run that fires before the drop waits a full
# extra month, so poll weekly instead: the ingest is a cheap read and the commit
# step no-ops unless the data actually moved.
#
# The Census ACS and MIT living wage sources are annual, so they are not on this
# schedule; run them by hand when a new vintage lands.
on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      # Each ingest exits non-zero if its feed is unreachable, malformed, missing
      # a tracked metro, or older than what is already committed. A failed run
      # leaves the last good data in place rather than publishing placeholders.
      - name: Fetch metro ZORI
        run: node scripts/fetch-rents.mjs

      - name: Fetch county ZORI
        run: node scripts/fetch-county-rents.mjs

      # The timing page reads the full monthly history out of the same feed. If
      # it is not rebuilt here it keeps naming an older last month than the map
      # does, and two pages of one site disagree about how current they are.
      - name: Rebuild rent history and seasonality
        run: node scripts/build-rent-history.mjs

      # Both suites. The ingest tests check the shape of what landed; the engine
      # tests check the claims the pages make against the data they now hold, so
      # a refresh that breaks a sentence on the site fails here rather than
      # shipping quietly. That is the whole point of running them on a refresh.
      - name: Verify the new data still passes
        run: node --test "test/*.test.mjs"

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip

      - name: Verify the engine still agrees with the new data
        run: |
          pip install -r requirements.txt -r requirements-dev.txt
          python -m pytest tests/ -q

      - name: Commit if the data moved
        run: |
          FILES="data/rents.json data/county-rents.json data/rent-history.json"
          if git diff --quiet -- $FILES; then
            echo "No change in rent data."
            exit 0
          fi

          ASOF=$(node -p "require('./data/rents.json').asOf")
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add $FILES
          git commit -m "data: refresh rents to ${ASOF}"
          git push
