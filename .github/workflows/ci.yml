name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  # The engine. Tax, bands, affordability, seasonality, rollups, and the two
  # golden fixtures that pin all of it against the JavaScript it was ported from.
  python:
    name: Engine tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: python -m pytest tests/ -q

  # The ingests, which stayed in Node. They are build-time: they fetch, parse and
  # commit the datasets the application reads, and never run in a request.
  node:
    name: Ingest tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - run: node --test "test/*.test.mjs"

  # The pages render from client-side ES modules against a live API, so a broken
  # import or a shape change returns HTTP 200 with a blank panel. Only a real
  # browser against the real server catches that.
  e2e:
    name: Browser tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip

      - run: pip install -r requirements.txt
      - run: npm ci

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      # Cached browsers still need the OS-level shared libraries.
      - name: Install system dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      # The suite boots the app itself; CI only has to put a python on PATH.
      - run: npx playwright test
        env:
          FLASK_PYTHON: python

      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

  # Deployment is not wired up. The site ran on GitHub Pages until the Flask
  # port, and Pages serves static files only — it cannot run this. render.yaml
  # and the Procfile are ready for a Python host; pointing this job at one is
  # the remaining step, and it needs an account and a deploy key that do not
  # exist yet. Leaving it unwired beats leaving a job that pretends to deploy.
