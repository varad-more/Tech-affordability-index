name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  # The engine. Tax, bands, affordability, seasonality, rollups, and the two
  # golden fixtures that pin all of it against the JavaScript it was ported from.
  python:
    name: Engine tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: python -m pytest tests/ -q

  # The ingests, which stayed in Node. They are build-time: they fetch, parse and
  # commit the datasets the application reads, and never run in a request.
  node:
    name: Ingest tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - run: node --test "test/*.test.mjs"

  # The pages render from client-side ES modules, so a broken import or a shape
  # change returns HTTP 200 with a blank panel. Only a real browser catches that.
  #
  # The suite runs against the frozen `dist/`, not against `flask run` — that is
  # the artefact Pages publishes, and a build step means there is a whole class
  # of bug that exists only in it. It also proves the browser's arithmetic
  # against a fixture generated by Python, case for case and to the last bit.
  e2e:
    name: Browser tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip

      - run: pip install -r requirements.txt
      - run: npm ci

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      # Cached browsers still need the OS-level shared libraries.
      - name: Install system dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      # The suite boots the app itself; CI only has to put a python on PATH.
      - run: npx playwright test
        env:
          FLASK_PYTHON: python

      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

  # Publish, but only from main and only once all three suites are green. The
  # deploy itself lives in pages.yml so that the data refresh can reach the same
  # definition rather than keeping a second copy of it.
  deploy:
    name: Deploy
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [python, node, e2e]
    uses: ./.github/workflows/pages.yml
    permissions:
      contents: read
      pages: write
      id-token: write
